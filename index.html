<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/startpage.css">
    <title>Start Page</title>

</head>

<body>

    <main id="page">


        <!-- ==================================================
             LEFT COLUMN
             Navigation + Scratchpad
             ================================================== -->

        <section id="left-column">


            <!-- Navigation / Flyout Links -->

            <nav id="quick-links" aria-label="Quick links">


                <!-- About Ryan White -->

                <div class="link-group">

                    <button
                        class="link-group-button"
                        type="button"
                        aria-expanded="false"
                    >
                        About Ryan White
                    </button>

                    <div class="link-flyout">

                        <a
                            href="https://www.facebook.com/ryan.white.77128261/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Facebook
                        </a>

                        <a
                            href="https://www.linkedin.com/in/ryan-white-7a90b181/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            LinkedIn
                        </a>

                    </div>

                </div>


                <!-- Shopping -->

                <div class="link-group">

                    <button
                        class="link-group-button"
                        type="button"
                        aria-expanded="false"
                    >
                        Shopping
                    </button>

                    <div class="link-flyout">

                        <a
                            href="https://smile.amazon.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Amazon
                        </a>

                        <a
                            href="https://www.walmart.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Walmart
                        </a>

                    </div>

                </div>


                <!-- Tech -->

                <div class="link-group">

                    <button
                        class="link-group-button"
                        type="button"
                        aria-expanded="false"
                    >
                        Tech
                    </button>

                    <div class="link-flyout">

                        <a
                            href="https://github.com/RyanDanWhite"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            My GitHub
                        </a>

                        <a
                            href="https://portal.azure.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Azure Portal
                        </a>

                        <a
                            href="https://dev.azure.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            DevOps
                        </a>

                        <a
                            href="https://todoist.com/app/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Todoist
                        </a>

                    </div>

                </div>


                <!-- The Googles -->

                <div class="link-group">

                    <button
                        class="link-group-button"
                        type="button"
                        aria-expanded="false"
                    >
                        The Googles
                    </button>

                    <div class="link-flyout">

                        <a
                            href="https://www.google.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Google Search
                        </a>

                        <a
                            href="https://www.google.com/maps"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Maps
                        </a>

                        <a
                            href="https://mail.google.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Gmail
                        </a>

                        <a
                            href="https://domains.google/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Domains
                        </a>

                        <a
                            href="https://cloud.google.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Cloud
                        </a>

                    </div>

                </div>

            </nav>


            <!-- Scratchpad -->

            <section id="scratchpad-panel">

                <div class="panel-header">

                    <h2>Scratchpad</h2>

                    <button
                        id="scratchpad-copy"
                        type="button"
                    >
                        Copy
                    </button>

                </div>

                <textarea
                    id="scratchpad"
                    placeholder="Quick notes..."
                    aria-label="Scratchpad"
                ></textarea>

            </section>


        </section>


        <!-- ==================================================
             RIGHT COLUMN
             Search + Clock
             ================================================== -->

        <aside id="right-column">


            <!-- Google Quick Search -->

            <section class="search-panel">

                <h2>Google</h2>

                <form
                    action="https://www.google.com/search"
                    method="get"
                    target="_blank"
                >

                    <input
                        type="search"
                        name="q"
                        placeholder="Search Google..."
                        aria-label="Search Google"
                        autocomplete="off"
                    >

                    <button type="submit">
                        Go
                    </button>

                </form>

            </section>

            <!-- Wikipedia Quick Search -->
            <section class="search-panel">
                <h2>Wikipedia</h2>

                <form
                    action="https://en.wikipedia.org/w/index.php"
                    method="get"
                    target="_blank"
                >
                    <input
                        type="search"
                        name="search"
                        placeholder="Search Wikipedia..."
                        aria-label="Search Wikipedia"
                        autocomplete="off"
                    >

                    <button type="submit">
                        Go
                    </button>
                </form>
            </section>

<!-- Weather -->
<section
    id="weather-panel"
    aria-label="Weather"
>
    <div class="weather-header">
        <h2>Weather</h2>
        <span id="weather-location">Toledo, OH</span>
    </div>

    <!-- Current Conditions -->
    <div class="weather-current">
        <div class="weather-current-main">
            <span id="weather-current-temp">--°</span>
            <span id="weather-current-condition">
                Loading...
            </span>
        </div>

        <div
            id="weather-current-details"
            class="weather-current-details"
        ></div>
    </div>

    <!-- Official Weather Alerts -->
    <div
        id="weather-alerts"
        aria-live="polite"
    ></div>

    <!-- Calculated Garden Frost Risk -->
    <div
        id="weather-frost-risk"
        aria-live="polite"
    ></div>

    <!-- Five-Day Forecast -->
    <div
        id="weather-forecast"
        class="weather-forecast"
        aria-label="Five-day forecast"
    ></div>

    <!-- Weather Actions -->
    <div class="weather-actions">
        <a
            id="weather-map-link"
            href="https://www.windy.com/"
            target="_blank"
            rel="noopener noreferrer"
        >
            Live Weather Map ↗
        </a>

        <button
            id="weather-use-location"
            type="button"
        >
            Use my location
        </button>
    </div>

    <!-- Loading / Error Status -->
    <div
        id="weather-status"
        role="status"
        aria-live="polite"
    ></div>
</section>

            <!-- Clock -->

            <div
                id="clock"
                aria-label="Current time"
            ></div>


        </aside>


    </main>

<script src="js/startpage.js"></script>
<script src="js/breakout.js"></script>
<script src="js/weather.js"></script>

</body>

</html>
